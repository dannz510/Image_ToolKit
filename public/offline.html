<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Dannz AI Studio - Offline</title>

<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  :root { color-scheme: dark light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }

    min-height: 100vh; display: grid; place-items: center;
    background: #0a0b0c; color: #F7F5EF;
    font-family: "Oswald", system-ui, sans-serif; text-align: center; padding: 24px;
  }
  .mark { width: 72px; height: 72px; margin: 0 auto 20px; display: block; }
  h1 { font-size: 28px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
  p { margin-top: 10px; font-family: "JetBrains Mono", monospace; font-size: 13px; color: #8a8882; }
  a { color: #D6523A; }
</style>
</head>
<body>
  <div>
    <img class="mark" src="/icon-192.png" alt="Dannz AI Studio" width="72" height="72" />
    <h1>You are offline</h1>
    <p>Dannz AI Studio needs a connection for the first visit.<br />Reconnect and reload to continue editing.</p>
    <p><a href="/">Reload</a></p>
  </div>
</body>
</html>
