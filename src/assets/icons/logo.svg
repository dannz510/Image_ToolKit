<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="logoGradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D6523A"/>
      <stop offset="50%" stop-color="#E86B55"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#logoGradient)" filter="url(#glow)"/>
  <path d="M32 12 L32 52 M12 32 L52 32" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <circle cx="32" cy="32" r="18" stroke="white" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.4"/>
  <ellipse cx="32" cy="32" rx="14" ry="6" stroke="white" stroke-width="1" opacity="0.2" transform="rotate(-45 32 32)"/>
</svg>