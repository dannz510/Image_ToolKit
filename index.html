<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Dannz AI Studio - Professional AI-powered image background removal, batch processing and editing studio. Local-first, free, no account required." />
  <meta name="theme-color" content="#0a0b0c" />
  <meta name="color-scheme" content="dark light" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dannz AI" />

  <!--
    Content Security Policy.

    Everything the app needs is first-party now: fonts are self-hosted, icons
    are inline SVG, and the only remote resource is the CloudFront background
    video on the empty state.

    script-src stays strict ('self') - that is the XSS boundary, and the app
    has no inline scripts (the theme bootstrap lives in /theme-init.js).

    style-src allows 'unsafe-inline' because React writes computed values
    (the comparison divider position, the progress bar width) as inline
    styles. Inline CSS cannot execute script, so this does not weaken the
    script-src guarantee.

    frame-ancestors is not repeated here: it is only honoured as an HTTP
    header, which Vercel sends (see vercel.json).
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob:;
    font-src 'self';
    media-src 'self' https://d8j0ntlcm91z4.cloudfront.net;
    connect-src 'self';
    manifest-src 'self';
    worker-src 'self';
    base-uri 'self';
    form-action 'self';
    object-src 'none';
  " />
  <title>Dannz AI Studio</title>
  <!-- External (not inlined) so the CSP can stay script-src 'self'. -->
  <script src="/theme-init.js"></script>
</head>
<body class="bg-bg-primary text-text-primary antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
